<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise-managed MCP authorization with AgentAction runtime authorization</title>
  <desc id="desc">A three-stage flow showing enterprise-managed MCP authentication, AgentAction runtime authorization, and provider-side receipt enforcement.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 34px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 600 21px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .panel-title { font: 800 16px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .02em; }
      .body { font: 500 15px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1e293b; }
      .small { font: 500 13px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .tiny { font: 600 12px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .label { font: 800 14px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .card { fill: #ffffff; stroke-width: 1.5; }
      .row { fill: rgba(255,255,255,.72); stroke: rgba(15,23,42,.08); stroke-width: 1; }
      .blue-panel { fill: #eff6ff; stroke: #bfdbfe; }
      .green-panel { fill: #f0fdf4; stroke: #bbf7d0; }
      .purple-panel { fill: #faf5ff; stroke: #e9d5ff; }
      .blue { fill: #1d4ed8; }
      .green { fill: #15803d; }
      .purple { fill: #7e22ce; }
      .red { fill: #dc2626; }
      .muted { fill: #64748b; }
      .blue-stroke { stroke: #2563eb; }
      .green-stroke { stroke: #16a34a; }
      .red-stroke { stroke: #dc2626; }
      .purple-stroke { stroke: #7e22ce; }
      .shadow { filter: drop-shadow(0 8px 18px rgba(15,23,42,.08)); }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="980"/>

  <text class="title" x="800" y="50" text-anchor="middle">Enterprise-Managed MCP Auth + AgentAction Runtime Authorization</text>
  <text class="subtitle" x="800" y="86" text-anchor="middle">MCP EMA controls connection setup. AgentAction makes each action auditable, scoped, and enforceable.</text>

  <g class="shadow">
    <rect x="34" y="130" width="390" height="640" rx="12" class="blue-panel"/>
    <rect x="34" y="130" width="390" height="48" rx="12" fill="#dbeafe"/>
    <text class="panel-title blue" x="70" y="160">1. ENTERPRISE-MANAGED MCP AUTH</text>
    <text class="body" x="229" y="218" text-anchor="middle">Authenticate once through the</text>
    <text class="body" x="229" y="240" text-anchor="middle">enterprise identity provider.</text>

    <rect x="58" y="330" width="104" height="86" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
    <circle cx="110" cy="360" r="13" fill="none" stroke="#0f172a" stroke-width="2"/>
    <path d="M86 393 Q110 374 134 393" fill="none" stroke="#0f172a" stroke-width="2"/>
    <text class="label" x="110" y="407" text-anchor="middle" fill="#0f172a">User / Agent</text>

    <line x1="162" y1="373" x2="236" y2="373" class="blue-stroke" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <text class="tiny" x="199" y="359" text-anchor="middle">SSO</text>

    <rect x="238" y="318" width="132" height="110" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
    <text class="label" x="304" y="356" text-anchor="middle" fill="#0f172a">Enterprise IdP</text>
    <text class="small" x="304" y="382" text-anchor="middle">OIDC / SAML</text>
    <text class="small" x="304" y="405" text-anchor="middle">group policy</text>

    <line x1="304" y1="428" x2="304" y2="496" class="blue-stroke" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow-blue)"/>
    <rect x="80" y="502" width="292" height="180" rx="10" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text class="label blue" x="226" y="530" text-anchor="middle">Identity Context</text>
    <text class="small" x="128" y="560">OK sub: user or agent</text>
    <text class="small" x="128" y="585">OK iss: enterprise IdP</text>
    <text class="small" x="128" y="610">OK aud: MCP gateway</text>
    <text class="small" x="128" y="635">OK groups, roles, client_id</text>
    <text class="small" x="128" y="660">OK exp, iat, jti</text>

    <rect x="54" y="790" width="356" height="92" rx="10" fill="#dbeafe" stroke="#bfdbfe"/>
    <text class="label blue" x="146" y="825">Establishes WHO</text>
    <text class="body" x="146" y="850">is calling and under which</text>
    <text class="body" x="146" y="872">enterprise identity context.</text>
    <path d="M94 817 l22 -10 l22 10 v26 q-22 20 -22 20 q-22 -20 -22 -20 z" fill="#2563eb" opacity=".9"/>
  </g>

  <g class="shadow">
    <rect x="576" y="130" width="448" height="640" rx="12" class="green-panel"/>
    <rect x="576" y="130" width="448" height="48" rx="12" fill="#dcfce7"/>
    <text class="panel-title green" x="626" y="160">2. AGENTACTION RUNTIME AUTHORIZATION</text>
    <text class="body" x="800" y="218" text-anchor="middle">Evaluate policy and live context before</text>
    <text class="body" x="800" y="240" text-anchor="middle">the agent-originated action executes.</text>

    <rect x="600" y="276" width="400" height="340" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <text class="label" x="810" y="315" text-anchor="middle" fill="#0f172a">AgentAction Gateway</text>
    <path d="M700 293 l20 -9 l20 9 v24 q-20 18 -20 18 q-20 -18 -20 -18 z" fill="none" stroke="#16a34a" stroke-width="3"/>
    <path d="M714 306 l5 7 l11 -16" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="626" y="352" width="348" height="42" rx="7" class="row"/>
    <text class="body" x="672" y="379">Validate enterprise identity token</text>
    <circle cx="946" cy="373" r="11" fill="#16a34a"/>
    <text class="tiny" x="946" y="377" text-anchor="middle" fill="#ffffff">OK</text>

    <rect x="626" y="404" width="348" height="42" rx="7" class="row"/>
    <text class="body" x="672" y="431">Map claims to authorization event</text>
    <circle cx="946" cy="425" r="11" fill="#16a34a"/>
    <text class="tiny" x="946" y="429" text-anchor="middle" fill="#ffffff">OK</text>

    <rect x="626" y="456" width="348" height="42" rx="7" class="row"/>
    <text class="body" x="672" y="483">Check scopes, groups, client, issuer</text>
    <circle cx="946" cy="477" r="11" fill="#16a34a"/>
    <text class="tiny" x="946" y="481" text-anchor="middle" fill="#ffffff">OK</text>

    <rect x="626" y="508" width="348" height="52" rx="7" class="row"/>
    <text class="body" x="672" y="532">Evaluate job, resource, customer,</text>
    <text class="body" x="672" y="552">approval, JIT grant, and data flow</text>
    <circle cx="946" cy="534" r="11" fill="#16a34a"/>
    <text class="tiny" x="946" y="538" text-anchor="middle" fill="#ffffff">OK</text>

    <rect x="626" y="570" width="348" height="42" rx="7" class="row"/>
    <text class="body" x="672" y="597">Issue signed scoped receipt</text>
    <circle cx="946" cy="591" r="11" fill="#16a34a"/>
    <text class="tiny" x="946" y="595" text-anchor="middle" fill="#ffffff">OK</text>

    <line x1="800" y1="616" x2="800" y2="655" class="green-stroke" stroke-width="3" marker-end="url(#arrow-green)"/>
    <rect x="604" y="660" width="392" height="82" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <text class="label green" x="800" y="686" text-anchor="middle">Authorization Receipt</text>
    <text class="small" x="672" y="714">sub, tenant, client, scopes/groups, tool</text>
    <text class="small" x="672" y="736">resource, job, decision, ttl, jti, conditions</text>
    <rect x="620" y="702" width="32" height="40" rx="4" fill="none" stroke="#334155" stroke-width="2"/>
    <path d="M642 702 v12 h10" fill="none" stroke="#334155" stroke-width="2"/>
  </g>

  <g class="shadow">
    <rect x="1176" y="130" width="390" height="640" rx="12" class="purple-panel"/>
    <rect x="1176" y="130" width="390" height="48" rx="12" fill="#f3e8ff"/>
    <text class="panel-title purple" x="1260" y="160">3. PROVIDER ENFORCEMENT</text>
    <text class="body" x="1371" y="218" text-anchor="middle">Verify the receipt and enforce provider</text>
    <text class="body" x="1371" y="240" text-anchor="middle">trust policy before executing.</text>

    <rect x="1200" y="276" width="342" height="370" rx="10" fill="#ffffff" stroke="#7e22ce" stroke-width="1.5"/>
    <text class="label" x="1388" y="318" text-anchor="middle" fill="#0f172a">MCP Provider / Server</text>
    <rect x="1246" y="294" width="28" height="7" rx="2" fill="none" stroke="#0f172a" stroke-width="2"/>
    <rect x="1246" y="306" width="28" height="7" rx="2" fill="none" stroke="#0f172a" stroke-width="2"/>
    <rect x="1246" y="318" width="28" height="7" rx="2" fill="none" stroke="#0f172a" stroke-width="2"/>

    <rect x="1224" y="358" width="294" height="44" rx="7" fill="#faf5ff" stroke="#e9d5ff"/>
    <text class="body" x="1264" y="386">Verify receipt signature</text>
    <circle cx="1490" cy="380" r="11" fill="#16a34a"/>
    <text class="tiny" x="1490" y="384" text-anchor="middle" fill="#ffffff">OK</text>

    <rect x="1224" y="414" width="294" height="50" rx="7" fill="#faf5ff" stroke="#e9d5ff"/>
    <text class="body" x="1264" y="435">Verify issuer, audience,</text>
    <text class="body" x="1264" y="455">and client</text>
    <circle cx="1490" cy="439" r="11" fill="#16a34a"/>
    <text class="tiny" x="1490" y="443" text-anchor="middle" fill="#ffffff">OK</text>

    <rect x="1224" y="476" width="294" height="54" rx="7" fill="#faf5ff" stroke="#e9d5ff"/>
    <text class="body" x="1264" y="499">Check resource, action,</text>
    <text class="body" x="1264" y="521">tenant, ttl, and replay</text>
    <circle cx="1490" cy="503" r="11" fill="#16a34a"/>
    <text class="tiny" x="1490" y="507" text-anchor="middle" fill="#ffffff">OK</text>

    <rect x="1224" y="542" width="294" height="50" rx="7" fill="#faf5ff" stroke="#e9d5ff"/>
    <text class="body" x="1264" y="563">Apply provider</text>
    <text class="body" x="1264" y="583">business policy</text>
    <circle cx="1490" cy="567" r="11" fill="#16a34a"/>
    <text class="tiny" x="1490" y="571" text-anchor="middle" fill="#ffffff">OK</text>

    <rect x="1224" y="604" width="294" height="44" rx="7" fill="#faf5ff" stroke="#e9d5ff"/>
    <text class="body" x="1264" y="632">Execute tool if allowed</text>
    <circle cx="1490" cy="626" r="11" fill="#16a34a"/>
    <text class="tiny" x="1490" y="630" text-anchor="middle" fill="#ffffff">OK</text>

    <line x1="1288" y1="648" x2="1288" y2="680" class="green-stroke" stroke-width="3" marker-end="url(#arrow-green)"/>
    <line x1="1454" y1="648" x2="1454" y2="680" class="red-stroke" stroke-width="3" marker-end="url(#arrow-red)"/>
    <text class="tiny green" x="1252" y="668" text-anchor="middle">Allow</text>
    <text class="tiny red" x="1418" y="668" text-anchor="middle">Deny</text>
    <rect x="1206" y="690" width="166" height="58" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
    <text class="label green" x="1289" y="716" text-anchor="middle">Tool Execution</text>
    <text class="small" x="1289" y="738" text-anchor="middle">(allowed)</text>
    <rect x="1382" y="690" width="154" height="58" rx="8" fill="#fef2f2" stroke="#dc2626"/>
    <text class="label red" x="1459" y="716" text-anchor="middle">Rejected</text>
    <text class="small" x="1459" y="738" text-anchor="middle">(mismatch)</text>
  </g>

  <line x1="370" y1="373" x2="562" y2="373" class="blue-stroke" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text class="label blue" x="468" y="343" text-anchor="middle">Enterprise identity</text>
  <text class="label blue" x="468" y="364" text-anchor="middle">context</text>

  <line x1="1000" y1="420" x2="1162" y2="420" class="green-stroke" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text class="label green" x="1082" y="390" text-anchor="middle">Signed receipt</text>
  <text class="label green" x="1082" y="411" text-anchor="middle">authorization context</text>

  <line x1="1000" y1="502" x2="1162" y2="502" class="red-stroke" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow-red)"/>
  <text class="label red" x="1082" y="490" text-anchor="middle">Deny before execution</text>

  <rect x="34" y="910" width="1532" height="52" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="label muted" x="60" y="941">Key capabilities:</text>
  <text class="small" x="190" y="941">IdP identity context</text>
  <text class="small" x="385" y="941">claim-to-event mapping</text>
  <text class="small" x="610" y="941">policy and JIT checks</text>
  <text class="small" x="820" y="941">scoped signed receipts</text>
  <text class="small" x="1040" y="941">provider verification</text>
  <text class="small" x="1245" y="941">replay and ttl enforcement</text>
  <text class="small" x="1460" y="941">allow / deny paths</text>
</svg>

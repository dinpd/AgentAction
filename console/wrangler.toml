name = "agentpass-observability-console"
main = "src/entry.ts"
compatibility_date = "2026-07-20"
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = true
preview_urls = false
keep_vars = true
keep_names = false

[vars]
NOTIFICATION_FROM_EMAIL = "alerts@agentaction.dev"
CONSOLE_ENVIRONMENT = "production"
CONSOLE_DIRECTORY_MODE = "true"
ACCESS_TEAM_DOMAIN = "https://upperhandteam.cloudflareaccess.com"
ACCESS_AUD = "5290e8fbe89e673417d9d8a317ccb28f86c7bfb125d50f03c969dd351f6033c5"
ACCESS_TENANT_CLAIM = "custom.tenant_id"
ACCESS_ROLE_CLAIM = "custom.tenant_role"
CONSOLE_STALE_AFTER_SECONDS = "300"

[[services]]
binding = "AGENTID_GATEWAY"
service = "agentid-gateway"

[[services]]
binding = "MCP_READINESS_SERVICE"
service = "agentaction-mcp-check"

[ai]
binding = "AGENT_AI"

[[durable_objects.bindings]]
name = "AGENT_WORKSPACES"
class_name = "AgentWorkspace"

[[migrations]]
tag = "agent-runtime-v1"
new_sqlite_classes = ["AgentWorkspace"]

[[durable_objects.bindings]]
name = "MCP_REGISTRY"
class_name = "McpRegistry"

[[migrations]]
tag = "mcp-registry-v1"
new_sqlite_classes = ["McpRegistry"]

[[durable_objects.bindings]]
name = "RECURRING_WORKSPACES"
class_name = "RecurringWorkspace"

[[migrations]]
tag = "recurring-workspace-v1"
new_sqlite_classes = ["RecurringWorkspace"]

[[send_email]]
name = "NOTIFICATION_EMAIL"
allowed_sender_addresses = ["alerts@agentaction.dev"]

[env.development]
name = "agentpass-observability-console-development"

[env.development.vars]
CONSOLE_ENVIRONMENT = "development"
CONSOLE_ENABLE_MOCK_IDENTITY = "true"
CONSOLE_MOCK_TENANT_ID = "refund-demo-agent"
CONSOLE_MOCK_SUBJECT = "local-operator"
CONSOLE_MOCK_EMAIL = "local-operator@agentpass.test"
ACCESS_TENANT_CLAIM = "custom.tenant_id"
CONSOLE_STATIC_TENANT_ID = "refund-demo-agent"
CONSOLE_STALE_AFTER_SECONDS = "300"

[[env.development.services]]
binding = "AGENTID_GATEWAY"
service = "agentid-gateway"

[env.development.ai]
binding = "AGENT_AI"
remote = true

[[env.development.durable_objects.bindings]]
name = "AGENT_WORKSPACES"
class_name = "AgentWorkspace"

[[env.development.durable_objects.bindings]]
name = "MCP_REGISTRY"
class_name = "McpRegistry"

[[env.development.durable_objects.bindings]]
name = "RECURRING_WORKSPACES"
class_name = "RecurringWorkspace"

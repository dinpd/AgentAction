name = "agentid-gateway"
main = "src/worker.ts"
compatibility_date = "2026-05-24"

# Set AGENTID_API_KEY as a secret in production:
#   npx wrangler secret put AGENTID_API_KEY
#
# For a single-tenant gateway, set AGENTID_MANIFEST_JSON as a Worker variable.
# For multi-tenant SaaS, bind AGENTID_MANIFESTS to Workers KV and store each
# tenant manifest JSON under its tenant ID. Routes then use:
#   /tenants/<tenant-id>/authorize
#   /tenants/<tenant-id>/jit-grants

[[durable_objects.bindings]]
name = "JIT_GRANTS"
class_name = "AgentIdJitGrants"

[[kv_namespaces]]
binding = "AGENTID_MANIFESTS"
id = "fcaf886fa671404b9b39033fb34f4990"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentIdJitGrants"]

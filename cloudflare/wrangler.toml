name = "agentid-gateway"
main = "src/worker.ts"
compatibility_date = "2026-05-24"

[vars]
AGENTACTION_CONSOLE_URL = "https://agentpass-observability-console.drisw.workers.dev/"
AGENTACTION_INVITATION_FROM_EMAIL = "invites@agentaction.dev"

# Set AGENTID_API_KEY as a secret in production:
#   npx wrangler secret put AGENTID_API_KEY
#
# Set a separate bearer secret for service-bound Workers:
#   npx wrangler secret put AGENTID_INTERNAL_SERVICE_TOKEN
#
# For the self-contained demo OIDC mode:
#   npx wrangler secret put AGENTID_DEMO_OIDC_SECRET
#
# Optional audit export:
#   npx wrangler secret put AGENTID_AUDIT_WEBHOOK_URL
#   npx wrangler secret put AGENTID_AUDIT_WEBHOOK_TOKEN
#
# For a single-tenant gateway, set AGENTID_MANIFEST_JSON as a Worker variable.
# For multi-tenant SaaS, bind AGENTID_MANIFESTS to Workers KV and store each
# tenant manifest JSON under its tenant ID. Routes then use:
#   /tenants/<tenant-id>/approval-requests
#   /tenants/<tenant-id>/authorize
#   /tenants/<tenant-id>/jit-grants

[[durable_objects.bindings]]
name = "JIT_GRANTS"
class_name = "AgentIdJitGrants"

[[kv_namespaces]]
binding = "AGENTID_MANIFESTS"
id = "fcaf886fa671404b9b39033fb34f4990"

[[send_email]]
name = "INVITATION_EMAIL"
allowed_sender_addresses = ["invites@agentaction.dev"]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentIdJitGrants"]

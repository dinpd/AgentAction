[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentid"
version = "0.1.2"
description = "A manifest, gateway, and CLI for AI agent tool-call authorization across SaaS, internal systems, and MCP gateways."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AgentID contributors" }]
dependencies = ["PyYAML>=6.0.1"]

[project.optional-dependencies]
dev = ["jsonschema>=4.23.0", "pytest>=9.0.3"]

[project.scripts]
agentid = "agentid.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentid*"]

name: AgentID Check

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "agentid/**"
      - "examples/**"
      - "schema/**"
      - "scripts/check_manifests.py"
      - "tests/**"
      - "pyproject.toml"
      - "action.yml"
      - ".github/workflows/agentid-check.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

  manifest-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: ./
        with:
          manifests: "examples/*.yaml"
          max-risk: "75"

  typescript-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build SDK
        run: npm run build

      - name: Test SDK
        run: npm test

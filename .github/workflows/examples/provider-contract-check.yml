name: Provider MCP Contract Check

on:
  pull_request:
    paths:
      - "provider-mcp-contract.yaml"
      - ".github/workflows/provider-contract-check.yml"

jobs:
  provider-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AgentAction
        run: python -m pip install "agentaction-dev @ git+https://github.com/dinpd/AgentAction.git@main"

      - name: Validate provider MCP contract
        run: agentaction provider validate provider-mcp-contract.yaml

      - name: Validate provider MCP contract JSON Schema
        run: |
          python - <<'PY'
          import json
          import urllib.request

          import yaml
          from jsonschema import Draft202012Validator

          schema_url = "https://raw.githubusercontent.com/dinpd/AgentAction/main/schema/provider-mcp-contract.schema.json"
          schema = json.load(urllib.request.urlopen(schema_url))
          contract = yaml.safe_load(open("provider-mcp-contract.yaml", encoding="utf-8"))
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(contract)
          PY

      - name: Diff provider MCP contract against base branch
        if: github.event_name == 'pull_request'
        run: |
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          if git cat-file -e "origin/${BASE_REF}:provider-mcp-contract.yaml" 2>/dev/null; then
            git show "origin/${BASE_REF}:provider-mcp-contract.yaml" > /tmp/base-provider-mcp-contract.yaml
            agentaction provider diff /tmp/base-provider-mcp-contract.yaml provider-mcp-contract.yaml
          else
            echo "No provider-mcp-contract.yaml found on base branch; skipping diff."
          fi

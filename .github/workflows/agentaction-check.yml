name: AgentAction Check

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "agentid/**"
      - "examples/**"
      - "schema/**"
      - "scripts/check_manifests.py"
      - "tests/**"
      - "pyproject.toml"
      - "action.yml"
      - ".github/workflows/agentaction-check.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Validate release metadata
        run: python scripts/check_release.py

      - name: Run tests
        run: python -m pytest

  manifest-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: ./
        with:
          manifests: "examples/customer-support-*-agent.yaml examples/provider-mcp-support-agent.yaml"
          max-risk: "75"

  # Packages checked by `npm test` and, where they have one, a type-checking build.
  # tests/test_ci_test_coverage.py fails when no pull-request workflow runs a package's test script.
  package-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/guard
          - packages/openclaw
          - packages/provider-express
          - mcp-gateway-adapter
          - cloudflare
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Build workspace guard dependency
        if: ${{ matrix.package == 'packages/openclaw' || matrix.package == 'mcp-gateway-adapter' }}
        working-directory: packages/guard
        run: npm ci && npm run build

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: npm ci

      - name: Test
        working-directory: ${{ matrix.package }}
        run: npm test

      - name: Build
        working-directory: ${{ matrix.package }}
        run: npm run build --if-present

  typescript-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build SDK
        run: npm run build

      - name: Test SDK
        run: npm test

name: Refund Demo

on:
  workflow_dispatch:
  pull_request:
    paths: ["demo/**", ".github/workflows/refund-demo.yml"]
  push:
    branches: [main]
    paths: ["demo/**", ".github/workflows/refund-demo.yml"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install browser acceptance runtime
        run: |
          npm install --prefix /tmp/agentaction-refund-browser --no-save playwright@1.63.0
          /tmp/agentaction-refund-browser/node_modules/.bin/playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          PLAYWRIGHT_MODULE: /tmp/agentaction-refund-browser/node_modules/playwright/index.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - run: npm ci
      - name: Deploy existing refund Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Refund demo deployment requires the existing Cloudflare repository secrets."
            exit 1
          fi
          npm run deploy

name: Cloudflare Observability Console

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "console/**"
      - "recipes/**"
      - "fixtures/mcp-capability-coverage-v1/**"
      - ".github/workflows/cloudflare-console.yml"
  push:
    branches: [main]
    paths:
      - "console/**"
      - "recipes/**"
      - "fixtures/mcp-capability-coverage-v1/**"
      - ".github/workflows/cloudflare-console.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test console security boundary
        run: npm test

      - name: Verify operator Worker bundle
        run: npm run dry-run

      - name: Install OAuth browser acceptance runtime
        run: |
          npm install --prefix /tmp/agentaction-oauth-browser --no-save playwright@1.63.0
          /tmp/agentaction-oauth-browser/node_modules/.bin/playwright install --with-deps chromium

      - name: Verify job-first draft review and outcome assessment
        run: node --experimental-strip-types tests/job-first-draft-browser.mts
        env:
          PLAYWRIGHT_MODULE: /tmp/agentaction-oauth-browser/node_modules/playwright/index.mjs

      - name: Verify explicit section saves and editable draft recovery
        run: node --experimental-strip-types tests/section-save-browser.mts
        env:
          PLAYWRIGHT_MODULE: /tmp/agentaction-oauth-browser/node_modules/playwright/index.mjs

      - name: Verify OAuth browser and durable workspace flow
        run: npm run test:oauth-browser
        env:
          PLAYWRIGHT_MODULE: /tmp/agentaction-oauth-browser/node_modules/playwright/index.mjs

      - name: Verify catalog RPC, storage and alarms
        run: npm run test:catalog-worker

      - name: Verify readiness Worker and persistence
        run: npm run dry-run:readiness && npm run test:readiness-worker

      - name: Verify anonymous public server and checker browser journey
        run: npm run test:readiness-browser
        env:
          PLAYWRIGHT_MODULE: /tmp/agentaction-oauth-browser/node_modules/playwright/index.mjs

      - name: Verify public demo Worker bundle
        run: npm run dry-run:demo

      - name: Check Cloudflare deploy secrets
        if: github.event_name != 'pull_request'
        id: cloudflare-secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping console deploy because CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not configured."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy public MCP readiness checker
        if: github.event_name != 'pull_request' && steps.cloudflare-secrets.outputs.configured == 'true'
        run: npm run deploy:readiness
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy console Worker
        if: github.event_name != 'pull_request' && steps.cloudflare-secrets.outputs.configured == 'true'
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy public console demo
        if: github.event_name != 'pull_request' && steps.cloudflare-secrets.outputs.configured == 'true'
        run: npm run deploy:demo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

name: Cloudflare Observability Console

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "console/**"
      - "integrations/hermes-agentaction/**"
      - "recipes/**"
      - "fixtures/mcp-capability-coverage-v1/**"
      - ".github/workflows/cloudflare-console.yml"
  push:
    branches: [main]
    paths:
      - "console/**"
      - "integrations/hermes-agentaction/**"
      - "recipes/**"
      - "fixtures/mcp-capability-coverage-v1/**"
      - ".github/workflows/cloudflare-console.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test console security boundary
        run: npm test

      - name: Verify operator Worker bundle
        run: npm run dry-run

      - name: Verify supervisor approvals and SQLite recovery across process restarts
        run: npm run test:supervisor-worker

      - name: Install OAuth browser acceptance runtime
        run: |
          npm install --prefix /tmp/agentaction-oauth-browser --no-save playwright@1.63.0
          /tmp/agentaction-oauth-browser/node_modules/.bin/playwright install --with-deps chromium

      - name: Verify supervisor settings and recovery evidence
        run: npm run test:supervisor-browser
        env:
          PLAYWRIGHT_MODULE: /tmp/agentaction-oauth-browser/node_modules/playwright/index.mjs

      - name: Verify agent and trial limit overrides against the runtime
        run: npm run test:supervisor-overrides-browser
        env:
          PLAYWRIGHT_MODULE: /tmp/agentaction-oauth-browser/node_modules/playwright/index.mjs

      - name: Verify Hermes registration, approvals and token lifecycle
        run: npm run test:hermes-browser
        env:
          PLAYWRIGHT_MODULE: /tmp/agentaction-oauth-browser/node_modules/playwright/index.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check out tested Hermes runtime
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 29112bef099274229cadff79cdff7bf7b99c4b77
          path: .hermes-runtime
          persist-credentials: false

      - name: Install Hermes runtime for synthetic execution acceptance
        run: python -m pip install -e ../.hermes-runtime

      - name: Verify real Hermes dispatch, claims and Worker restart recovery
        run: npm run test:hermes-worker
        env:
          HERMES_RUNTIME: ${{ github.workspace }}/.hermes-runtime
          HERMES_PYTHON: python

      - name: Verify job-first draft review and outcome assessment
        run: node --experimental-strip-types tests/job-first-draft-browser.mts
        env:
          PLAYWRIGHT_MODULE: /tmp/agentaction-oauth-browser/node_modules/playwright/index.mjs

      - name: Verify explicit section saves and editable draft recovery
        run: node --experimental-strip-types tests/section-save-browser.mts
        env:
          PLAYWRIGHT_MODULE: /tmp/agentaction-oauth-browser/node_modules/playwright/index.mjs

      - name: Verify preparation skills, research briefs and version adoption
        run: node --experimental-strip-types tests/preparation-browser.mts
        env:
          PLAYWRIGHT_MODULE: /tmp/agentaction-oauth-browser/node_modules/playwright/index.mjs

      - name: Verify approval feedback and grouped run history
        run: node --experimental-strip-types tests/run-approval-browser.mts
        env:
          PLAYWRIGHT_MODULE: /tmp/agentaction-oauth-browser/node_modules/playwright/index.mjs

      - name: Verify approval queue, counts and exact request navigation
        run: node --experimental-strip-types tests/approval-queue-browser.mts
        env:
          PLAYWRIGHT_MODULE: /tmp/agentaction-oauth-browser/node_modules/playwright/index.mjs

      - name: Verify daily social research configuration and approval
        run: node --experimental-strip-types tests/research-browser.mts
        env:
          PLAYWRIGHT_MODULE: /tmp/agentaction-oauth-browser/node_modules/playwright/index.mjs

      - name: Verify frozen workflow and run evidence inspection
        run: node --experimental-strip-types tests/workflow-inspector-browser.mts
        env:
          PLAYWRIGHT_MODULE: /tmp/agentaction-oauth-browser/node_modules/playwright/index.mjs

      - name: Verify Monitor status and exact approval links
        run: node --experimental-strip-types tests/agent-history-browser.mts
        env:
          PLAYWRIGHT_MODULE: /tmp/agentaction-oauth-browser/node_modules/playwright/index.mjs

      - name: Verify OAuth browser and durable workspace flow
        run: npm run test:oauth-browser
        env:
          PLAYWRIGHT_MODULE: /tmp/agentaction-oauth-browser/node_modules/playwright/index.mjs

      - name: Verify catalog RPC, storage and alarms
        run: npm run test:catalog-worker

      - name: Verify readiness Worker and persistence
        run: npm run dry-run:readiness && npm run test:readiness-worker

      - name: Verify anonymous public server and checker browser journey
        run: npm run test:readiness-browser
        env:
          PLAYWRIGHT_MODULE: /tmp/agentaction-oauth-browser/node_modules/playwright/index.mjs

      - name: Verify public demo Worker bundle
        run: npm run dry-run:demo

      - name: Check Cloudflare deploy secrets
        if: github.event_name != 'pull_request'
        id: cloudflare-secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping console deploy because CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not configured."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy public MCP readiness checker
        if: github.event_name != 'pull_request' && steps.cloudflare-secrets.outputs.configured == 'true'
        run: npm run deploy:readiness
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy console Worker
        if: github.event_name != 'pull_request' && steps.cloudflare-secrets.outputs.configured == 'true'
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy public console demo
        if: github.event_name != 'pull_request' && steps.cloudflare-secrets.outputs.configured == 'true'
        run: npm run deploy:demo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
